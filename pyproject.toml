[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mbah-Royce", email = "alemchu123@yahoo.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.18",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-agent = "ai_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
